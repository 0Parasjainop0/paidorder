<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            margin: 0;
            background: #020408;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        canvas {
            box-shadow: 0 0 80px rgba(0, 247, 255, 0.15);
            border-radius: 30px;
        }
    </style>
</head>

<body>
    <canvas id="logoCanvas" width="800" height="800"></canvas>
    <script>
        const canvas = document.getElementById('logoCanvas');
        const ctx = canvas.getContext('2d');
        const cx = 400;
        const cy = 350;

        // --- UTILS ---
        function drawHex(x, y, r) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                ctx.lineTo(x + r * Math.cos(i * Math.PI / 3), y + r * Math.sin(i * Math.PI / 3));
            }
            ctx.closePath();
            ctx.stroke();
        }

        // --- BACKGROUND ---
        // Deep Radial Gradient
        const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 600);
        bgGrad.addColorStop(0, '#0a1d33');
        bgGrad.addColorStop(1, '#020408');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 800, 800);

        // Hex Grid Background
        ctx.strokeStyle = 'rgba(0, 247, 255, 0.03)';
        ctx.lineWidth = 1;
        for (let y = 0; y < 900; y += 40) {
            for (let x = 0; x < 900; x += 70) {
                drawHex(x + (y % 80 == 0 ? 0 : 35), y, 23);
            }
        }

        // --- MAIN HUD ELEMENTS ---
        const cyan = '#00f7ff';
        const blue = '#0066ff';
        const white = '#ffffff';

        // Outer Segmented Ring
        function drawSegmentedRing(radius, segments, width, color, speedOffset = 0) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.shadowBlur = width * 1.5;
            ctx.shadowColor = color;

            const step = (Math.PI * 2) / segments;
            const gap = 0.2;

            for (let i = 0; i < segments; i++) {
                ctx.beginPath();
                ctx.arc(cx, cy, radius, i * step + gap + speedOffset, (i + 1) * step - gap + speedOffset);
                ctx.stroke();
            }
        }

        drawSegmentedRing(220, 3, 4, blue);
        drawSegmentedRing(200, 2, 8, cyan);
        drawSegmentedRing(185, 12, 2, 'rgba(255,255,255,0.5)');

        // Inner Tech Circle (Filled)
        const innerGrad = ctx.createLinearGradient(cx - 150, cy - 150, cx + 150, cy + 150);
        innerGrad.addColorStop(0, 'rgba(0, 247, 255, 0.1)');
        innerGrad.addColorStop(1, 'rgba(0, 102, 255, 0.05)');
        ctx.fillStyle = innerGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, 180, 0, Math.PI * 2);
        ctx.fill();

        // --- CENTRAL SYMBOL (R + ARROW) ---
        ctx.shadowBlur = 40;
        ctx.shadowColor = cyan;

        // Digital "R"
        ctx.fillStyle = white;
        ctx.font = 'bold 240px "Segoe UI", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('R', cx - 20, cy + 15); // Slight offset left

        // Rising Arrow (Integrated)
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 18;
        ctx.strokeStyle = cyan;
        ctx.shadowColor = blue;

        ctx.beginPath();
        // Start from bottom right of R, go up
        ctx.moveTo(cx + 40, cy + 80);
        ctx.lineTo(cx + 100, cy + 80);
        ctx.lineTo(cx + 100, cy - 60);
        ctx.lineTo(cx + 140, cy - 60);
        ctx.stroke();

        // Arrow Head
        ctx.fillStyle = cyan;
        ctx.beginPath();
        ctx.moveTo(cx + 140, cy - 60);
        ctx.lineTo(cx + 120, cy - 90);
        ctx.lineTo(cx + 160, cy - 90);
        ctx.fill();

        // --- TEXT ---
        ctx.shadowBlur = 20;
        ctx.shadowColor = cyan;

        // "RAJ"
        ctx.fillStyle = cyan;
        ctx.font = '900 90px "Segoe UI"'; // Ultra bold
        ctx.textAlign = 'center';
        ctx.fillText('RAJ', cx, cy + 300);

        // "STOCK SERVER"
        ctx.shadowBlur = 10;
        ctx.shadowColor = blue;
        ctx.fillStyle = white;
        ctx.font = '600 32px "Courier New"'; // Tech mono
        ctx.letterSpacing = '12px';
        ctx.fillText('STOCK SERVER', cx, cy + 360);

        // Decoration Lines
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx - 250, cy + 380);
        ctx.lineTo(cx + 250, cy + 380);
        ctx.stroke();

        // Little dots under line
        ctx.fillStyle = cyan;
        ctx.beginPath(); ctx.arc(cx - 250, cy + 380, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 250, cy + 380, 3, 0, Math.PI * 2); ctx.fill();

    </script>
</body>

</html>
